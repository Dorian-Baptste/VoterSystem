<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voting System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <div class="container mt-4">
        <h1 class="mb-4 text-center">Voting System</h1>

        <div id="candidateDisplayArea" class="mb-4 p-3 bg-light rounded">
            <h2 class="h4 text-center mb-3">Candidates</h2>
            <div class="row justify-content-center" id="candidateInfoList">
                <p class="text-center">Loading candidates...</p>
            </div>
        </div>
        <div id="registrationSection" class="form-section">
            <h2 class="mb-3">Register to Vote</h2>
            <form id="registerForm">
                <div class="mb-3">
                    <label for="firstName" class="form-label">First Name</label>
                    <input type="text" class="form-control" id="firstName" name="firstName" required>
                </div>
                <div class="mb-3">
                    <label for="lastName" class="form-label">Last Name</label>
                    <input type="text" class="form-control" id="lastName" name="lastName" required>
                </div>
                <div class="mb-3">
                    <label for="address" class="form-label">Street Address</label>
                    <input type="text" class="form-control" id="address" name="address" required>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="city" class="form-label">City</label>
                        <input type="text" class="form-control" id="city" name="city" required>
                    </div>
                    <div class="col-md-3 mb-3">
                        <label for="state" class="form-label">State</label>
                        <input type="text" class="form-control" id="state" name="state" required>
                    </div>
                    <div class="col-md-3 mb-3">
                        <label for="zip" class="form-label">Zip Code</label>
                        <input type="text" class="form-control" id="zip" name="zip" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary">Register & Verify Address</button>
            </form>
            <div id="registrationMessage" class="mt-3"></div>
            <div id="mapContainer" style="display: none;">
                <h4 class="mt-4">Verified Address Location:</h4>
                <div id="map" aria-label="Map showing verified address location"></div>
            </div>
        </div>

        <div id="votingSection" class="form-section" style="display: none;">
            <h2 id="welcomeVoter"></h2>
            <h4 class="mb-3">Click a candidate image above or their name below to cast vote!</h4>
            <form id="voteForm">
                <div id="candidateList" class="mb-3">
                    <p>Loading candidates...</p>
                </div>
                <button type="submit" class="btn btn-success">Submit Vote</button>
            </form>
             <div id="voteMessage" class="mt-3"></div>
             <button type="button" id="registerAgainButton" class="btn btn-secondary mt-3 d-none">
                 Register Another Voter
             </button>
        </div>
    </div>

    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js" integrity="sha384-2huaZvOR9iDzHqslqwpR87isEmrfxqyWOF7hr7BY6KG0+hVKLoEXMPUJw3ynWuhO" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="/js/main.js"></script>
</body>
</html>
