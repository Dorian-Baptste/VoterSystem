<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voting System</title>
    <link rel="stylesheet" href="/css/styles.css">
    <script src="https://cdn.socket.io/4.0.1/socket.io.min.js"></script>
</head>
<body>
    <div class="container">
        <h1>Welcome to the Voting System</h1>
        <form id="voteForm">
            <h3>Select your candidate</h3>
            <label>
                <input type="radio" name="candidate" value="1"> Marcus Ching (Party A)
            </label><br>
            <label>
                <input type="radio" name="candidate" value="2"> Darius (Party A)
            </label><br>
            <label>
                <input type="radio" name="candidate" value="3"> Diddy Dhanraj (Party B)
            </label><br>
            <label>
                <input type="radio" name="candidate" value="4"> Bombardino Crocodilo (Party B)
            </label><br>
            <button type="submit">Submit Vote</button>
        </form>

        <div id="voteResults">
            <h3>Current Vote Counts</h3>
            <ul>
                <li>Marcus Ching: <span id="voteA1">0</span></li>
                <li>Darius: <span id="voteA2">0</span></li>
                <li>Diddy Dhanraj: <span id="voteB1">0</span></li>
                <li>Bombardino Crocodilo: <span id="voteB2">0</span></li>
            </ul>
        </div>
    </div>

    <script src="/js/main.js"></script>
</body>
</html>
